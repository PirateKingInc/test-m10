<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8ecae6" />
    <title>Junk Magnet</title>
    <link rel="icon" href="data:," />
    <style>
      /* inline boot loader so something is on screen on the very first paint */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #8ecae6;
        font: 900 34px 'Trebuchet MS', system-ui, sans-serif;
        color: #fff;
        text-shadow: 0 4px 0 #1b1b3a;
        z-index: 10;
        transition: opacity 0.25s;
      }
      #boot .bar {
        width: 180px;
        height: 14px;
        border: 3px solid #fff;
        border-radius: 99px;
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 30%;
        background: #ffd23f;
        animation: load 0.9s ease-in-out infinite alternate;
      }
      @keyframes load {
        to {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">🧲 JUNK MAGNET<div class="bar"><i></i></div></div>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
